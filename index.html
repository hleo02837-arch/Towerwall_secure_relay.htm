
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DREAMER</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Georgia,serif}body{background:#0a1f14;background-image:radial-gradient(circle at 20% 20%,rgba(34,255,136,.06) 0 2px,transparent 3px),radial-gradient(circle at 80% 80%,rgba(201,162,39,.08) 0 2px,transparent 3px);display:flex;justify-content:center;color:#fff}.w{width:100%;max-width:430px;min-height:100vh;padding:22px 22px 10px;border-left:1px solid #8a6d1a;border-right:1px solid #8a6d1a;background:linear-gradient(180deg,#0e2a1c,#071a10 60%,#0a2015);text-align:center;position:relative}.w:before,.w:after{content:"";position:absolute;top:0;bottom:0;width:1px;background:#8a6d1a}.w:before{left:6px}.w:after{right:6px}.top{color:#d4af37;letter-spacing:7px;font-size:15px}.sub{color:#e8d9a0;font-size:17px;font-style:italic;margin:3px 0 18px}.shield{width:210px;height:245px;margin:0 auto;background:linear-gradient(180deg,#0c3a26,#04160d);border:3px solid #d4af37;border-radius:100px 100px 110px 110px/18px 18px 110px 110px;position:relative;box-shadow:inset 0 0 0 6px #071f12,inset 0 0 0 7px rgba(212,175,55,.6),0 0 30px rgba(212,175,55,.35);display:flex;flex-direction:column;align-items:center;justify-content:center}.crown{font-size:48px;z-index:2;margin-top:8px}.apple{font-size:92px;z-index:2;filter:drop-shadow(0 0 18px #2bff88);margin-top:-4px}.dream{font-size:44px;letter-spacing:10px;color:#e8d9a0;margin-top:20px;font-weight:400}.guard{color:#c9a227;letter-spacing:4px;font-size:14px;margin-top:2px}.div{display:flex;align-items:center;gap:10px;margin:18px 20px 14px;color:#c9a227}.div i{flex:1;height:1px;background:#c9a227}.div b{font-size:10px}.enter{letter-spacing:3px;font-size:17px;color:#f5ecd0;margin:14px 0 12px}.dots{display:flex;gap:8px;justify-content:center;margin:10px 0}.dot{width:15px;height:15px;border-radius:50%;border:1.5px solid #c9a227;background:transparent}.dot.on{background:#22ff88;box-shadow:0 0 10px #22ff88}.keylab{color:#c9a227;letter-spacing:4px;font-size:13px;margin:12px 0 14px}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:0 6px}.k{height:56px;border-radius:16px;border:1.5px solid #c9a227;background:#0a2418;color:#e8d9a0;font-size:26px;font-family:Georgia}.k:active{background:#c9a227;color:#02120a}.finger{width:66px;height:66px;margin:16px auto 6px;border:2px solid #c9a227;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;background:#08271a;box-shadow:0 0 20px rgba(34,255,136,.4)}.bio{color:#c9a227;letter-spacing:3px;font-size:11px}.foot{margin-top:14px;color:#c9a227;letter-spacing:4px;font-size:11px}.msg{min-height:20px;color:#7dffb0;font-family:Arial;font-weight:900;margin-top:6px}</style></head><body><div class="w"><div class="top">GREEN GABLES</div><div class="sub">Apple Towerwall system</div><div class="shield"><div class="crown">👑</div><div class="apple">🍏</div></div><div class="dream">DREAMER</div><div class="guard">— ROYAL GUARDIAN —</div><div class="div"><i></i><b>◆</b><i></i></div><div class="enter">ENTER HADES KEY</div><div class="dots" id="dots"></div><div class="keylab">HADES KEY 1.7.7.7</div><div class="pad" id="pad"></div><div class="finger">👆</div><div class="bio">BIOMETRIC • HEARTBEAT VERIFIED</div><div class="msg" id="m"></div><div class="foot">DREAM • PROTECT • INNOVATE</div></div><script>let c="";const d=document.getElementById("dots"),m=document.getElementById("m"),p=document.getElementById("pad");function r(){d.innerHTML="";for(let i=0;i<10;i++){let e=document.createElement("div");e.className="dot"+(i<c.length?" on":"");d.appendChild(e)}}function f(k){if(k==="×")c="";else if(k==="⌫")c=c.slice(0,-1);else if(c.length<10)c+=k;r();if(c==="1777")m.textContent="✅ FORTRESS OPEN DREAMER! ECHO AMEN 7777!"}["1","2","3","4","5","6","7","8","9","×","0","⌫"].forEach(k=>{let b=document.createElement("button");b.className="k";b.textContent=k;b.onclick
