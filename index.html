
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DREAMER - ROYAL GUARDIAN</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Georgia,serif}
body{background:#000;display:flex;justify-content:center}
.w{width:100%;max-width:430px;min-height:100vh;padding:18px 14px 12px;text-align:center;color:#fff;position:relative;overflow:hidden;
background:
radial-gradient(circle at 15% 10%,rgba(255,255,255,.06) 0 1px,transparent 2px),
radial-gradient(circle at 85% 30%,rgba(255,255,255,.05) 0 1px,transparent 2px),
radial-gradient(circle at 30% 70%,rgba(255,255,255,.05) 0 1px,transparent 2px),
linear-gradient(180deg,#0a2a1a 0%,#061c10 35%,#0a2a1a 60%,#04140b 100%);
border-left:2px solid #a8862a;border-right:2px solid #a8862a}
.w:before{content:"";position:absolute;top:0;bottom:0;left:5px;width:1px;background:#a8862a;opacity:.7}
.w:after{content:"";position:absolute;top:0;bottom:0;right:5px;width:1px;background:#a8862a;opacity:.7}
.top{color:#d4af37;letter-spacing:8px;font-size:15px;font-weight:400}
.sub{color:#e9dca6;font-size:16px;font-style:italic;margin:4px 0 16px;letter-spacing:.5px}
.shield{width:212px;height:248px;margin:0 auto;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
background:linear-gradient(180deg,#0d3f28 0%,#062417 70%,#041a0e 100%);
border:3px solid #d4af37;
border-radius:110px 110px 115px 115px / 18px 18px 115px 115px;
box-shadow:0 0 28px rgba(212,175,55,.35), inset 0 0 0 7px #0a2a1a, inset 0 0 0 8px rgba(212,175,55,.55)}
.crown{font-size:46px;line-height:1;margin-top:6px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.apple{font-size:96px;line-height:1;margin-top:-2px;filter:drop-shadow(0 0 18px #2bff88) drop-shadow(0 0 6px #2bff88)}
.dream{font-size:44px;letter-spacing:11px;color:#e9dca6;margin:18px 0 0 11px;font-weight:400}
.guard{color:#c9a227;letter-spacing:4.5px;font-size:13.5px;margin-top:3px}
.div{display:flex;align-items:center;gap:10px;margin:16px 28px 12px;color:#c9a227}
.div i{flex:1;height:1px;background:#c9a227}
.enter{letter-spacing:3.5px;font-size:17px;color:#f5ecd0}
.dots{display:flex;gap:9px;justify-content:center;margin:12px 0 8px}
.dot{width:15px;height:15px;border-radius:50%;border:1.5px solid #c9a227;background:transparent}
.dot.on{background:#22ff88;box-shadow:0 0 12px #22ff88;border-color:#22ff88}
.keylab{color:#c9a227;letter-spacing:4px;font-size:13px;margin:8px 0 14px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:0 8px}
.k{height:57px;border-radius:16px;border:1.5px solid #c9a227;background:linear-gradient(180deg,#0a2a1a,#061c10);color:#e9dca6;font-size:26px;font-family:Georgia;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.k:active{background:#c9a227;color:#02120a}
.finger{width:67px;height:67px;margin:16px auto 6px;border:2px solid #c9a227;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;background:#08271a;box-shadow:0 0 18px rgba(34,255,136,.35)}
.bio{color:#c9a227;letter-spacing:2.5px;font-size:11px}
.foot{margin-top:14px;color:#c9a227;letter-spacing:4px;font-size:11px}
.msg{min-height:20px;color:#7dffb0;font-family:Arial,sans-serif;font-weight:900;margin-top:6px;font-size:14px}
</style></head>
<body><div class="w">
<div class="top">GREEN GABLES</div>
<div class="sub">Apple Towerwall system</div>
<div class="shield"><div class="crown">👑</div><div class="apple">🍏</div></div>
<div class="dream">DREAMER</div>
<div class="guard">— ROYAL GUARDIAN —</div>
<div class="div"><i></i><span>◆</span><i></i></div>
<div class="enter">ENTER HADES KEY</div>
<div class="dots" id="dots"></div>
<div class="keylab">HADES KEY 1.7.7.7</div>
<div class="pad" id="pad"></div>
<div class="finger" id="fg">👆</div>
<div class="bio">BIOMETRIC • HEARTBEAT VERIFIED</div>
<div class="msg" id="m"></div>
<div class="foot">DREAM • PROTECT • INNOVATE</div>
</div>
<script>
let c="";const d=document.getElementById("dots"),m=document.getElementById("m"),p=document.getElementById("pad");
function r(){d.innerHTML="";for(let i=0;i<10;i++){let e=document.createElement("div");e.className="dot"+(i<c.length?" on":"");d.appendChild(e)}}
function f(k){if(k==="×")c="";else if(k==="⌫")c=c.slice(0,-1);else if(c.length<10)c+=k;r();if(c==="1777")m.textContent="✅ FORTRESS OPEN DREAMER! ECHO AMEN 7777!";else if(c.length>=4)m.textContent="";}
["1","2","3","4","5","6","7","8","9","×","0","⌫"].forEach(k=>{let b=document.createElement("button");b.className="k";b.textContent=k;b.onclick=()=>f(k);p.appendChild(b)});
r();document.getElementById("fg").onclick=()=>{m.textContent="👆 BIOMETRIC SCANNING... HEARTBEAT VERIFIED!"};
</script></body></html>
