
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DREAMER</title><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#02120a;display:flex;justify-content:center}.w{width:100%;max-width:430px;height:100vh;position:relative;background:url('dreamer.jpg') center top/cover no-repeat;overflow:hidden}.dots{position:absolute;top:52.5%;left:0;right:0;display:flex;gap:12px;justify-content:center}.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid #c9a227}.dot.on{background:#22ff88;box-shadow:0 0 12px #22ff88}.pad{position:absolute;top:60.5%;left:13%;right:13%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.k{height:52px;border-radius:14px;border:1.5px solid rgba(201,162,39,.7);background:rgba(2,20,12,.45);color:#e8d9a0;font-size:26px;font-family:Georgia}.k:active{background:#c9a227;color:#02120a}.finger{position:absolute;top:88%;left:50%;transform:translateX(-50%);width:66px;height:66px;border-radius:50%;border:2px solid #c9a227;background:rgba(2,20,12,.3);display:flex;align-items:center;justify-content:center;font-size:28px;color:#22ff88}#m{position:absolute;top:95%;left:0;right:0;text-align:center;color:#7dffb0;font-weight:900;font-family:Arial}</style></head><body><div class="w"><div class="dots" id="dots"></div><div class="pad" id="pad"></div><div class="finger" id="fg">👆</div><div id="m"></div></div><script>let c="";const d=document.getElementById("dots"),m=document.getElementById("m"),p=document.getElementById("pad");function r(){d.innerHTML="";for(let i=0;i<10;i++){let e=document.createElement("div");e.className="dot"+(i<c.length?" on":"");d.appendChild(e)}}function f(k){if(k==="×")c="";else if(k==="⌫")c=c.slice(0,-1);else if(c.length<10)c+=k;r();if(c==="1777")m.textContent="✅ FORTRESS OPEN DREAMER! ECHO AMEN 7777!"}["1","2","3","4","5","6","7","8","9","×","0","⌫"].forEach(k=>{let b=document.createElement("button");b.className="k";b.textContent=k;b.onclick=()=>f(k);p.appendChild(b)});r();document.getElementById("fg").onclick=()=>{m.textContent="👆 BIOMETRIC SCANNING... HEARTBEAT VERIFIED!"};</script></body></html>
