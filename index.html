<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Green Gables - Towerwall</title>
  <style>
    :root {
      --green: #22ff88;
      --purple: #a855f7;
      --dark: #1e0a3d;
      --deep: #0a0218;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: var(--deep);
      color: var(--purple);
      font-family: Georgia, serif;
      padding: 16px;
      text-align: center;
    }
    .frame {
      max-width: 430px;
      width: 100%;
      margin: 0 auto;
      border: 2px solid var(--purple);
      border-radius: 16px;
      padding: 20px 16px;
      background: radial-gradient(circle at 50% 0%, rgba(168, 85, 247, 0.2), transparent 60%), var(--deep);
      box-shadow: 0 0 24px rgba(168, 85, 247, 0.25);
    }
    .top {
      letter-spacing: 5px;
      font-size: 22px;
      color: var(--purple);
      font-weight: 700;
    }
    .sub {
      letter-spacing: 3px;
      font-size: 15px;
      color: var(--purple);
      margin-top: 4px;
    }
    .shield {
      position: relative;
      width: 230px;
      height: 260px;
      margin: 34px auto 10px;
      border: 3px solid var(--purple);
      border-radius: 24px 24px 115px 115px;
      background: linear-gradient(180deg, var(--dark) 0%, var(--deep) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 22px rgba(34, 255, 136, 0.25);
    }
    .shield::before {
      content: "👑";
      position: absolute;
      top: -32px;
      font-size: 42px;
    }
    .apple {
      font-size: 110px;
      line-height: 1;
      filter: drop-shadow(0 0 25px var(--green));
    }
    h1 {
      letter-spacing: 8px;
      font-size: 38px;
      color: var(--purple);
      margin-top: 14px;
    }
    .guard {
      letter-spacing: 4px;
      font-size: 15px;
      border-top: 1px solid var(--purple);
      padding-top: 8px;
      margin-top: 8px;
      color: var(--green);
    }
    h2 {
      letter-spacing: 3px;
      font-size: 19px;
      margin: 14px 0 4px;
      color: var(--green);
    }
    .dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 16px 0;
    }
    .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--dark);
      border: 2px solid var(--purple);
      transition: all 0.15s ease;
    }
    .dot.on {
      background: var(--green);
      border-color: var(--green);
      box-shadow: 0 0 12px var(--green);
    }
    .keylabel {
      letter-spacing: 3px;
      font-size: 13px;
      color: var(--purple);
      margin: 10px 0 14px;
      min-height: 18px;
    }
    .pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 320px;
      margin: 0 auto 18px;
    }
    .pad button {
      height: 54px;
      background: var(--dark);
      color: var(--purple);
      border: 1.5px solid var(--purple);
      border-radius: 10px;
      font-family: inherit;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
    }
    .pad button:active,
    .pad button:hover {
      background: var(--green);
      color: var(--deep);
      border-color: var(--green);
      box-shadow: 0 0 14px var(--green);
    }
    .finger {
      width: 78px;
      height: 78px;
      margin: 8px auto 14px;
      border-radius: 50%;
      border: 2px solid var(--green);
      background: var(--dark);
      color: var(--green);
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(34, 255, 136, 0.35);
    }
    .back {
      display: inline-block;
      margin-top: 8px;
      padding: 10px 16px;
      border: 1px solid var(--green);
      border-radius: 8px;
      color: var(--green);
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="top">GREEN GABLES</div>
    <div class="sub">APPLE TOWERWALL SYSTEM</div>

    <div class="shield">
      <div class="apple">🍏</div>
    </div>

    <h1>TOWERWALL</h1>
    <div class="guard">ROYAL GUARDIAN · ECHO-AMEN-7777</div>
    <h2 id="status-msg">ENTER HADES KEY</h2>

    <div class="dots" id="dots" aria-hidden="true">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <div class="keylabel" id="keylabel">TAP KEYPAD OR BIOMETRIC SCANNER</div>

    <div class="pad">
      <button type="button" onclick="pressDigit('1')">1</button>
      <button type="button" onclick="pressDigit('2')">2</button>
      <button type="button" onclick="pressDigit('3')">3</button>
      <button type="button" onclick="pressDigit('4')">4</button>
      <button type="button" onclick="pressDigit('5')">5</button>
      <button type="button" onclick="pressDigit('6')">6</button>
      <button type="button" onclick="pressDigit('7')">7</button>
      <button type="button" onclick="pressDigit('8')">8</button>
      <button type="button" onclick="pressDigit('9')">9</button>
      <button type="button" onclick="clearCode()">CLR</button>
      <button type="button" onclick="pressDigit('0')">0</button>
      <button type="button" onclick="verifyCode()">OK</button>
    </div>

    <button type="button" class="finger" aria-label="Biometric scanner" onclick="scanFinger()">◉</button>
    <br>
    <a class="back" href="index.html">⬅ MAIN PAGE</a>
  </div>

  <script>
    let entered = "";
    const dots = Array.from(document.querySelectorAll("#dots .dot"));
    const statusMsg = document.getElementById("status-msg");
    const keyLabel = document.getElementById("keylabel");

    function updateDots() {
      dots.forEach((dot, idx) => {
        dot.classList.toggle("on", idx < entered.length);
      });
    }

    function pressDigit(digit) {
      if (entered.length >= dots.length) return;
      entered += digit;
      updateDots();
      keyLabel.textContent = "KEY LENGTH: " + entered.length + " / " + dots.length;
    }

    function clearCode() {
      entered = "";
      updateDots();
      statusMsg.textContent = "ENTER HADES KEY";
      keyLabel.textContent = "CLEARED";
    }

    function verifyCode() {
      if (!entered) {
        keyLabel.textContent = "ENTER DIGITS FIRST";
        return;
      }
      statusMsg.textContent = "KEY LOGGED · ACTIVE";
      keyLabel.textContent = "CODE [" + entered + "] VERIFIED";
    }

    function scanFinger() {
      statusMsg.textContent = "BIOMETRIC VERIFIED";
      keyLabel.textContent = "HEARTBEAT CONFIRMED · 🍏";
    }
  </script>
</body>
</html>
